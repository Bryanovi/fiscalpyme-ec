services:
  postgres:
    image: postgres:17-alpine
    container_name: fiscalpyme-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: fiscalpyme
      POSTGRES_USER: fiscalpyme
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - fiscalpyme-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U fiscalpyme -d fiscalpyme
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fiscalpyme-postgres-data: